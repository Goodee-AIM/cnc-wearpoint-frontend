name: Sync to GitLab

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main branch to GitLab
        run: |
          git push "https://oauth2:${{ secrets.GITLAB_SYNC_TOKEN }}@gitlab.com/cnc-wearpoint/cnc-wearpoint-frontend.git" HEAD:main