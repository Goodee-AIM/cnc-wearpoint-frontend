stages:
  - test
  - build

default:
  tags:
    - cnc-wp-runner

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

lint_frontend:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint

build_frontend:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - test -n "$VITE_API_BASE_URL"
    - npm run build

  artifacts:
    paths:
      - dist/
    expire_in: 1 day

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'