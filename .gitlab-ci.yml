# CI 단계: 코드 검사 → 이미지 빌드 → 릴리스 승격
stages:
  - test
  - image
  - promote
  - deploy

# NHN Cloud VM에 등록한 GitLab Runner 사용
default:
  tags:
    - cnc-wp-runner

variables:
  IMAGE_REPO: "quay.io/melona240/cnc-wearpoint-frontend"

# npm 의존성 캐시
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# main 브랜치 코드 검사
lint_frontend:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# main 커밋 기준 Docker 이미지 1회 빌드 및 SHA 태그 Push
build_image:
  stage: image
  script:
    - echo "$QUAY_TOKEN" | docker login quay.io -u "$QUAY_USERNAME" --password-stdin
    - docker build -t "$IMAGE_REPO:$CI_COMMIT_SHA" .
    - docker push "$IMAGE_REPO:$CI_COMMIT_SHA"
    - docker logout quay.io
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 검증된 SHA 이미지를 버전 태그와 latest로 승격
promote_image:
  stage: promote
  script:
    - echo "$QUAY_TOKEN" | docker login quay.io -u "$QUAY_USERNAME" --password-stdin
    - docker pull "$IMAGE_REPO:$CI_COMMIT_SHA"
    - docker tag "$IMAGE_REPO:$CI_COMMIT_SHA" "$IMAGE_REPO:$CI_COMMIT_TAG"
    - docker tag "$IMAGE_REPO:$CI_COMMIT_SHA" "$IMAGE_REPO:latest"
    - docker push "$IMAGE_REPO:$CI_COMMIT_TAG"
    - docker push "$IMAGE_REPO:latest"
    - docker logout quay.io
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

# 승인된 버전 이미지를 운영 VM에 자동 배포
deploy_frontend:
  stage: deploy

  # 운영 배포 동시 실행 방지
  resource_group: frontend-production

  script:
    - cd /opt/cnc-wearpoint/frontend

    # 승인된 고정 버전 이미지 배포
    - FRONTEND_IMAGE_TAG="$CI_COMMIT_TAG" docker compose pull
    - FRONTEND_IMAGE_TAG="$CI_COMMIT_TAG" docker compose up -d --remove-orphans

    # Frontend Container 기동 확인
    - |
      READY=0
      for i in 1 2 3 4 5; do
        if curl -fsS http://127.0.0.1:8080 >/dev/null; then
          READY=1
          break
        fi
        sleep 2
      done
      test "$READY" -eq 1

    # 외부 HTTPS 및 Backend 확인
    - curl -fsS https://aimw.duckdns.org >/dev/null
    - curl -fsS https://aimw.duckdns.org/health

  environment:
    name: production
    url: https://aimw.duckdns.org

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
